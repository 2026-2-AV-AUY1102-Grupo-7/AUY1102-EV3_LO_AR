name: GitHub Advanced Security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  # Analisis de dependencias: bloquea PRs que agregan dependencias con vulnerabilidades criticas
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  # Escaneo de secretos sobre el codigo y el historial
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown --fail

  # Analisis estatico con CodeQL (resultados en la pestana Security)
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
