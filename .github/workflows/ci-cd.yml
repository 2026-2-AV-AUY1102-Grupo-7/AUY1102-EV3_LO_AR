name: CI/CD Pipeline

# Se dispara en cada push a develop y en cada pull request hacia main
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: auy1102-ev3

jobs:
  # 1. Construccion de la imagen Docker y pruebas unitarias dentro del contenedor
  build-and-test:
    name: Build Docker y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir imagen de pruebas (target test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

      - name: Ejecutar pruebas unitarias dentro del contenedor
        run: docker run --rm ${{ env.IMAGE_NAME }}:test

      - name: Construir imagen final (target runtime)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

  # 2. Snyk: dependencias (SCA) y codigo (SAST); falla con severidad critical
  snyk:
    name: Snyk
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      - run: npm ci --ignore-scripts
      - name: Snyk Open Source (dependencias)
        run: snyk test --severity-threshold=critical
      - name: Snyk Code (analisis estatico)
        run: snyk code test --severity-threshold=critical

  # 3. Docker Scout: vulnerabilidades de la imagen; falla con severidad critical
  docker-scout:
    permissions:
      contents: read
      pull-requests: write
    name: Docker Scout
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir imagen para analizar
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha,scope=runtime
      - name: Docker Scout CVEs
        uses: docker/scout-action@4bbf17a9da65a7b5497361bb407e88cc9548f69c # v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}:scan
          only-severities: critical
          exit-code: true

  # 4. SonarCloud (workflow reutilizable)
  sonarcloud:
    name: SonarCloud
    needs: build-and-test
    uses: ./.github/workflows/sonarcloud.yml
    secrets: inherit

  # 5. GitHub Advanced Security: dependencias + secretos + CodeQL (workflow reutilizable)
  ghas:
    name: GitHub Advanced Security
    needs: build-and-test
    uses: ./.github/workflows/ghas.yml
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read

  # 6. Compuerta de calidad: interrumpe el despliegue si algun analisis fallo
  quality-gate:
    name: Quality gate
    needs: [snyk, docker-scout, sonarcloud, ghas]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado de los analisis
        run: |
          echo "snyk=${{ needs.snyk.result }} scout=${{ needs.docker-scout.result }} sonar=${{ needs.sonarcloud.result }} ghas=${{ needs.ghas.result }}"
          if [ "${{ needs.snyk.result }}" != "success" ] || [ "${{ needs.docker-scout.result }}" != "success" ] || [ "${{ needs.sonarcloud.result }}" != "success" ] || [ "${{ needs.ghas.result }}" != "success" ]; then
            echo "::error::Problemas criticos de seguridad o calidad: despliegue interrumpido"
            exit 1
          fi

  # 7. Despliegue: publica en Docker Hub solo si pruebas y analisis pasaron (push a develop)
  publish:
    name: Publicar en Docker Hub
    needs: [build-and-test, quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y publicar
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime
